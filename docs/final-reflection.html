<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Reflection</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Georgia', sans-serif;
      background: #f9f6fa;
      color: #5a5a5a;
      padding: 40px 20px;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      color: #D97FB8;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-align: center;
    }
    textarea {
      width: 100%;
      min-height: 300px;
      padding: 16px;
      font-size: 1.1em;
      border: 2px solid #FFD9EC;
      border-radius: 10px;
      background: #fff;
      resize: vertical;
      margin-bottom: 20px;
    }
    label {
      font-weight: 600;
      color: #B3909C;
      display: block;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Final Reflection</h1>
  <form>
    <label for="final-reflection">Type your final reflection below:</label>
    <textarea id="final-reflection" name="final-reflection" placeholder="Write your final reflection here..."></textarea>
  </form>
</body>
</html>
